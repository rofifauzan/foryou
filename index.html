// FITUR TAMBAH FOTO MY NOTE
const photoPicker = document.getElementById('note-photo-picker');
const photoGrid = document.getElementById('note-photo-grid');
const photoStatus = document.getElementById('note-photo-status');

const photoStoreKey = 'rofi-my-note-photos';

function loadNotePhotos() {
  let photos = [];

  try {
    photos = JSON.parse(localStorage.getItem(photoStoreKey) || '[]');
  } catch (error) {}

  photoGrid.innerHTML = '';

  photos.forEach((src, index) => {
    const card = document.createElement('div');
    card.className = 'note-upload-card';

    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Foto kenangan ' + (index + 1);

    // Klik foto untuk memperbesar
    img.addEventListener('click', () => {
      if (typeof showPhoto === 'function') {
        showPhoto(img);
      }
    });

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = 'Hapus';

    remove.addEventListener('click', () => {
      photos.splice(index, 1);

      localStorage.setItem(
        photoStoreKey,
        JSON.stringify(photos)
      );

      loadNotePhotos();
    });

    card.append(img, remove);
    photoGrid.appendChild(card);
  });
}

// Memilih dan menyimpan foto
photoPicker.addEventListener('change', async () => {
  const files = Array.from(photoPicker.files || [])
    .filter(file => file.type.startsWith('image/'));

  if (!files.length) return;

  let photos = [];

  try {
    photos = JSON.parse(localStorage.getItem(photoStoreKey) || '[]');
  } catch (error) {}

  for (const file of files) {
    if (photos.length >= 12) break;

    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const compressed = await new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => {
          const scale = Math.min(
            1,
            1200 / Math.max(image.width, image.height)
          );

          const canvas = document.createElement('canvas');

          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));

          canvas.getContext('2d').drawImage(
            image, 0, 0, canvas.width, canvas.height
          );

          resolve(canvas.toDataURL('image/jpeg', 0.78));
        };

        image.onerror = reject;
        image.src = dataUrl;
      });

      photos.push(compressed);

    } catch (error) {}
  }

  try {
    localStorage.setItem(photoStoreKey, JSON.stringify(photos));
    photoStatus.textContent = 'Foto berhasil ditambahkan!';
    loadNotePhotos();
  } catch (error) {
    photoStatus.textContent = 'Penyimpanan penuh. Hapus beberapa foto.';
  }

  photoPicker.value = '';
});

loadNotePhotos();

  <img id="lightbox-image" src="" alt="Foto diperbesar">
</div>

<script>
// Klik foto galeri untuk memperbesar, klik area gelap atau X untuk menutup.
let photoZoom = 1;

function showPhoto(img) {
    const box = document.getElementById('photo-lightbox');
    const large = document.getElementById('lightbox-image');

    photoZoom = 1;
    large.src = img.src;
    large.alt = img.alt || 'Foto diperbesar';
    large.style.transform = 'scale(1)';

    box.classList.add('active');
    box.setAttribute('aria-hidden', 'false');
}

function zoomPhoto(amount, event) {
    if (event) event.stopPropagation();

    photoZoom = Math.max(0.5, Math.min(4, photoZoom * amount));

    document.getElementById('lightbox-image')
        .style.transform = `scale(${photoZoom})`;
}

function resetPhotoZoom(event) {
    if (event) event.stopPropagation();

    photoZoom = 1;
    document.getElementById('lightbox-image')
        .style.transform = 'scale(1)';
}

function hidePhoto(event) {
    if (event && event.target.id === 'lightbox-image') return;
    if (event) event.stopPropagation();

    const box = document.getElementById('photo-lightbox');
    box.classList.remove('active');
    box.setAttribute('aria-hidden', 'true');

    const large = document.getElementById('lightbox-image');
    large.src = '';
    large.style.transform = 'scale(1)';
    photoZoom = 1;
}
// My Note: catatan disimpan di browser perangkat ini.
document.addEventListener('DOMContentLoaded', () => {
  const lockForm = document.getElementById('lock-form');
  lockForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const password = document.getElementById('site-password').value;
    if (password === 'mysalsa') {
      document.getElementById('lock-screen').style.display = 'none';
    } else {
      document.getElementById('lock-error').textContent = 'Password belum tepat. Coba lagi.';
      document.getElementById('site-password').value = '';
    }
  });

  const note = document.getElementById('note-text');
  const savedNote = localStorage.getItem('rofi-my-note');
  if (savedNote) note.value = savedNote;
  document.getElementById('save-note').addEventListener('click', () => {
    localStorage.setItem('rofi-my-note', note.value);
    document.getElementById('note-status').textContent = 'Catatan berhasil disimpan di browser ini.';
  });

  const audio = document.getElementById('background-audio');
  const musicButton = document.getElementById('floating-music');
  musicButton.addEventListener('click', async () => {
    if (audio.paused) {
      try { await audio.play(); }
      catch (error) { document.getElementById('note-status').textContent = 'Musik belum bisa diputar. Coba tekan tombol sekali lagi.'; }
    } else audio.pause();
  });
  audio.addEventListener('play', () => {
    musicButton.classList.add('playing');
    musicButton.setAttribute('aria-label', 'Jeda musik');
  });
  audio.addEventListener('pause', () => {
    musicButton.classList.remove('playing');
    musicButton.setAttribute('aria-label', 'Putar musik');
  });
});

function openPanel(panelId) {
  closePanels();
  const panel = document.getElementById(panelId);
  if (panel) {
    panel.classList.add('active');
    panel.setAttribute('aria-hidden', 'false');
  }
}
function closePanels() {
  document.querySelectorAll('.panel').forEach(panel => {
    panel.classList.remove('active');
    panel.setAttribute('aria-hidden', 'true');
  });
  const video = document.querySelector('#music-panel video');
  if (video) video.pause();
  const audio = document.querySelector('#music-panel audio');
  if (audio) audio.pause();
  const playButton = document.getElementById('play-pause-button');
  if (playButton) playButton.textContent = '▶ Putar';
}
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') { closePanels(); hidePhoto(); }
});

        // Setup Scene, Camera, Renderer
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        // Kabut latar belakang untuk efek kedalaman
        scene.fog = new THREE.FogExp2(0x05050d, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Kontrol Mouse / Touch (Bisa diputar dengan mouse)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // -------------------------------------------------------------
        // 1. MEMBUAT BOLA PLANET (PARTIKEL)
        // -------------------------------------------------------------
        const planetRadius = 7;
        const planetParticleCount = 300000;
        const planetGeometry = new THREE.BufferGeometry();
        const planetPositions = new Float32Array(planetParticleCount * 3);
        const planetColors = new Float32Array(planetParticleCount * 3);

        const colorCoreBlue = new THREE.Color(0x00d2ff);
        const colorCoreWhite = new THREE.Color(0xffffff);

        for (let i = 0; i < planetParticleCount; i++) {
            // Distribusi acak permukaan bola (Sphere Surface)
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = planetRadius + (Math.random() - 0.5) * 0.4;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            planetPositions[i * 3] = x;
            planetPositions[i * 3 + 1] = y;
            planetPositions[i * 3 + 2] = z;

            // Variasi Warna Planet (biru & putih)
            const mixedColor = colorCoreBlue.clone().lerp(colorCoreWhite, Math.random() * 0.5);
            planetColors[i * 3] = mixedColor.r;
            planetColors[i * 3 + 1] = mixedColor.g;
            planetColors[i * 3 + 2] = mixedColor.b;
        }

        planetGeometry.setAttribute('position', new THREE.BufferAttribute(planetPositions, 3));
        planetGeometry.setAttribute('color', new THREE.BufferAttribute(planetColors, 3));

        const planetMaterial = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const planetMesh = new THREE.Points(planetGeometry, planetMaterial);
        scene.add(planetMesh);

        // -------------------------------------------------------------
        // 2. MEMBUAT CINCIN PLANET (RING OF PARTICLES)
        // -------------------------------------------------------------
        const ringParticleCount = 300000;
        const ringGeometry = new THREE.BufferGeometry();
        const ringPositions = new Float32Array(ringParticleCount * 3);
        const ringColors = new Float32Array(ringParticleCount * 3);

        const colorCyan = new THREE.Color(0x00f0ff);
        const colorDarkBlue = new THREE.Color(0x0044ff);
        const colorGold = new THREE.Color(0xffaa00);

        for (let i = 0; i < ringParticleCount; i++) {
            const innerRadius = 10;
            const outerRadius = 22;
            const radius = THREE.MathUtils.lerp(innerRadius, outerRadius, Math.pow(Math.random(), 1.5));
            const angle = Math.random() * Math.PI * 2;

            // Posisi melingkar dengan sedikit variasi ketebalan (Y)
            const x = Math.cos(angle) * radius;
            const y = (Math.random() - 0.5) * (1.2 * (radius / outerRadius));
            const z = Math.sin(angle) * radius;

            ringPositions[i * 3] = x;
            ringPositions[i * 3 + 1] = y;
            ringPositions[i * 3 + 2] = z;

            // Pewarnaan Cincin Gradasi Biru, Cyan, hingga Emas di bagian luar
            let baseColor;
            if (radius < 13) {
                baseColor = colorDarkBlue.clone().lerp(colorCyan, Math.random());
            } else if (radius < 18) {
                baseColor = colorCyan.clone().lerp(colorCoreWhite, Math.random() * 0.7);
            } else {
                baseColor = colorCyan.clone().lerp(colorGold, Math.random() * 0.8);
            }

            ringColors[i * 3] = baseColor.r;
            ringColors[i * 3 + 1] = baseColor.g;
            ringColors[i * 3 + 2] = baseColor.b;
        }

        ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
        ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

        const ringMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const ringMesh = new THREE.Points(ringGeometry, ringMaterial);
        
        // Miringkan Cincin Planet
        ringMesh.rotation.x = Math.PI / 7;
        ringMesh.rotation.z = -Math.PI / 10;
        scene.add(ringMesh);

        // -------------------------------------------------------------
        // 3. DEBU BINTANG & PARTIKEL LATAR BELAKANG
        // -------------------------------------------------------------
        const bgParticleCount = 10000;
        const bgGeometry = new THREE.BufferGeometry();
        const bgPositions = new Float32Array(bgParticleCount * 3);

        for (let i = 0; i < bgParticleCount; i++) {
            bgPositions[i * 3] = (Math.random() - 0.5) * 120;
            bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 120;
            bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 120;
        }

        bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));

        const bgMaterial = new THREE.PointsMaterial({
            size: 0.08,
            color: 0xffffff,
            transparent: true,
            opacity: 0.4
        });

        const bgMesh = new THREE.Points(bgGeometry, bgMaterial);
        scene.add(bgMesh);

        // -------------------------------------------------------------
        // ANIMASI & LOOP RENDER
        // -------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            // Putar Planet & Cincin
            planetMesh.rotation.y += 0.002;
            ringMesh.rotation.y += 0.003;
            bgMesh.rotation.y -= 0.0003;

            controls.update();
            renderer.render(scene, camera);
        }

        // Responsif saat jendela browser di-resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Jalankan Animasi
        animate();
    
</script>
</body>
</html>
